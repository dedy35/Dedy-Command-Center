services:
  db:
    image: postgres:16-alpine
    container_name: dedy-command-center-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dedy_command_center}
      POSTGRES_USER: ${POSTGRES_USER:-dedy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dedy_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dedy} -d ${POSTGRES_DB:-dedy_command_center}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dedy-command-center-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dedy:dedy_dev_password@db:5432/dedy_command_center?schema=public
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Dedy Command Center}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_DEFAULT_TIMEZONE: ${NEXT_PUBLIC_DEFAULT_TIMEZONE:-Asia/Tokyo}
      AUTH_EMAIL: ${AUTH_EMAIL:-dedy@local.dev}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-change_me_in_local_env}
      AUTH_SECRET: ${AUTH_SECRET:-change_this_to_a_long_random_secret_at_least_32_chars}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev:docker

volumes:
  postgres_data:
